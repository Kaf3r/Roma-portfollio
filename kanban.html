<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Доска задач — Рома</title>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme) {
        document.documentElement.setAttribute('data-theme', theme);
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Рома</a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html#about" class="nav__link">Обо мне</a></li>
          <li><a href="index.html#skills" class="nav__link">Навыки</a></li>
          <li><a href="index.html#projects" class="nav__link">Проекты</a></li>
          <li><a href="index.html#contacts" class="nav__link">Контакты</a></li>
        </ul>
      </nav>
      <button class="nav__toggle" id="navToggle" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1 class="section__title">Доска задач</h1>

        <div class="kanban-toolbar">
          <input type="text" id="kanbanSearch" class="kanban-search" placeholder="Поиск задач..." />
          <select id="kanbanFilter" class="kanban-filter">
            <option value="all">Все колонки</option>
            <option value="todo">Сделать</option>
            <option value="inProgress">В работе</option>
            <option value="done">Готово</option>
          </select>
          <button id="kanbanAdd" class="btn btn--primary">Новая задача</button>
        </div>

        <div class="kanban-board" id="kanbanBoard">
          <div class="kanban-column" data-status="todo">
            <div class="kanban-column__header">
              <h2 class="kanban-column__title">Сделать</h2>
              <span class="kanban-column__count" data-count="todo">0</span>
            </div>
            <div class="kanban-column__body" data-status="todo"></div>
            <div class="kanban-empty" data-empty="todo">
              <p class="kanban-empty__text">Нет задач</p>
            </div>
          </div>

          <div class="kanban-column" data-status="inProgress">
            <div class="kanban-column__header">
              <h2 class="kanban-column__title">В работе</h2>
              <span class="kanban-column__count" data-count="inProgress">0</span>
            </div>
            <div class="kanban-column__body" data-status="inProgress"></div>
            <div class="kanban-empty" data-empty="inProgress">
              <p class="kanban-empty__text">Нет задач</p>
            </div>
          </div>

          <div class="kanban-column" data-status="done">
            <div class="kanban-column__header">
              <h2 class="kanban-column__title">Готово</h2>
              <span class="kanban-column__count" data-count="done">0</span>
            </div>
            <div class="kanban-column__body" data-status="done"></div>
            <div class="kanban-empty" data-empty="done">
              <p class="kanban-empty__text">Нет задач</p>
            </div>
          </div>
        </div>

        <div class="kanban-no-results" id="kanbanNoResults" style="display: none;">
          <p class="kanban-no-results__text">Ничего не найдено</p>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="taskModal" aria-hidden="true">
    <div class="modal__overlay" id="modalOverlay"></div>
    <div class="modal__dialog">
      <div class="modal__header">
        <h3 class="modal__title" id="modalTitle">Новая задача</h3>
        <button class="modal__close" id="modalClose" aria-label="Закрыть">&times;</button>
      </div>
      <form id="taskForm" class="modal__form">
        <input type="hidden" id="taskId" />
        <div class="form-group">
          <label for="taskTitle" class="form-label">Название</label>
          <input type="text" id="taskTitle" class="form-input" required placeholder="Введите название" />
        </div>
        <div class="form-group">
          <label for="taskDesc" class="form-label">Описание</label>
          <textarea id="taskDesc" class="form-input form-input--textarea" rows="4" placeholder="Введите описание"></textarea>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn--ghost" id="modalCancel">Отмена</button>
          <button type="button" class="btn btn--danger" id="modalDelete" style="display: none;">Удалить</button>
          <button type="submit" class="btn btn--primary">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="footer__copy">&copy; 2026 Рома. Все права защищены.</p>
      <a href="index.html#projects" class="btn btn--primary">Назад к проектам</a>
    </div>
  </footer>

  <script src="kanban.js"></script>
  <script src="theme.js"></script>
</body>
</html>
